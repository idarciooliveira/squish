name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # mozjpeg builds without nasm, just slower.
      - run: sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The build with no quantizer must still compile (FR-6).
      - run: cargo check -p squish-core --no-default-features
      # A CLI-only build, without `squish serve`, must pass its own tests (ADR-0020).
      - run: cargo test -p squish --no-default-features
      # bench/images/ is gitignored, so golden.rs skips here and the fixtures carry the run (ADR-0020).
      - run: cargo test --workspace

  fuzz-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - run: sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      # Fails when the fuzz target no longer builds, or when a committed
      # seed crashes: the corpus dir seeds the run before any mutations.
      - run: cargo +nightly fuzz build
      - run: cargo +nightly fuzz run fuzz_compress fuzz/corpus/fuzz_compress -- -runs=100 -max_total_time=60

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the version, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: sudo apt-get install -y musl-tools nasm
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p squish --target x86_64-unknown-linux-musl
      - run: |
          size=$(stat -c %s target/x86_64-unknown-linux-musl/release/squish)
          echo "binary: $size bytes"
          test "$size" -lt 15000000
