name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # mozjpeg builds without nasm, just slower.
      - run: sudo apt-get install -y nasm
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The build with no quantizer must still compile (FR-6).
      - run: cargo check -p squish-core --no-default-features
      # A CLI-only build, without `squish serve`, must pass its own tests (ADR-0020).
      - run: cargo test -p squish --no-default-features
      # bench/images/ is gitignored, so golden.rs skips here and the fixtures carry the run (ADR-0020).
      - run: cargo test --workspace
