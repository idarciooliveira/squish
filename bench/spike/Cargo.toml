[package]
name = "spike"
version = "0.0.0"
edition = "2021"

# Throwaway Phase 0 benchmark. NOT a workspace member (ADR-0020):
# may link GPL (imagequant) and AGPL (dssim) crates for comparison.
# Never add this as a dependency of squish crates.

[dependencies]
image = "0.25"
png = "0.18"
oxipng = "10.2"
quantette = "0.6"
imagequant = "4.4"
mozjpeg = "0.10"
dssim = "3.5"
rgb = "0.8"
quantizr = "1.4.3"
exoquant = "0.2.0"
color_quant = "2.0.0"
jpegli = "0.1.0"
ssimulacra2 = "0.5.1"
fast-ssim2 = "0.9.0"
butteraugli = "0.9.3"
image-compare = "0.5.0"
libc = "0.2.190"
webp = "0.3"

[profile.dev]
opt-level = 2
